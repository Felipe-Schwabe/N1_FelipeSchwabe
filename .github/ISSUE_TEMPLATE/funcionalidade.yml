name: Funcionalidade
description: Proponha uma funcionalidade ou melhoria para o PRISMA
title: "feat: "
body:
  - type: textarea
    id: necessidade
    attributes:
      label: Qual necessidade ou experiência isto atende?
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] O jogador consegue...
        - [ ] O jogo apresenta...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Gameplay e fases
        - Cenas e interface
        - Scripts e lógica
        - Artes e áudio
        - Documentação e configuração
    validations:
      required: true
