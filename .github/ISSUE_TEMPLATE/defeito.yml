name: Defeito
description: Relate um erro encontrado no PRISMA
title: "fix: "
labels: ["defeito"]
body:
  - type: input
    id: versao
    attributes:
      label: Versão do Godot, versão do jogo e sistema operacional
      placeholder: "Godot 4.6; versão/build; Windows, Linux ou macOS"
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abra...
        2. Selecione...
        3. Pressione...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado e resultado obtido
    validations:
      required: true
  - type: textarea
    id: evidencias
    attributes:
      label: Evidências ou mensagens de erro
      description: Inclua captura de tela ou trecho do erro, removendo dados pessoais.
    validations:
      required: false
